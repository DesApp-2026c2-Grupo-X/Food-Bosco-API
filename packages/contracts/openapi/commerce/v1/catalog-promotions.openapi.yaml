openapi: 3.0.3
info:
  title: Commerce — Catálogo y promociones públicas
  version: 1.0.0
  description: |
    Contrato de lectura del catálogo con previews de promociones y del catálogo
    público de promociones. El carrito sigue siendo la fuente autoritativa del
    precio final.

    El gateway resuelve `addressId` contra Auth y envía `lat`/`lng` a Commerce.
    Commerce resuelve la sucursal más cercana disponible, igual que el carrito.
servers:
  - url: http://localhost:4202
security:
  - bearerAuth: []
paths:
  /v1/catalog/products:
    get:
      operationId: listProducts
      summary: Listar productos con previews de promociones
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - name: categoryId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Listado de productos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
  /v1/catalog/products/{productId}:
    get:
      operationId: getProduct
      summary: Obtener un producto con previews de promociones
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/branches/available/products:
    get:
      operationId: listAvailableBranchProducts
      summary: Listar productos de la sucursal más cercana con previews
      parameters:
        - $ref: '#/components/parameters/LatitudeRequired'
        - $ref: '#/components/parameters/LongitudeRequired'
      responses:
        '200':
          description: Productos con disponibilidad por sucursal
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BranchProduct'
        '400':
          $ref: '#/components/responses/ValidationError'
  /v1/catalog/promotions/public:
    get:
      operationId: listPublicPromotions
      summary: Promociones públicas activas para banners
      responses:
        '200':
          description: Promociones públicas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Promotion'
  /v1/catalog/promotions/public/catalog:
    get:
      operationId: getPublicPromotionCatalog
      summary: Catálogo público de promociones vigentes
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          description: Promociones vigentes con categorías y productos hidratados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionCatalogItem'
        '400':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Latitude:
      name: lat
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Longitude:
      name: lng
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    LatitudeRequired:
      name: lat
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    LongitudeRequired:
      name: lng
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
  responses:
    ValidationError:
      description: Parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, path]
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PromotionBadgeKind:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT, BUY_X_GET_Y, COUPON, INFORMATIONAL]
    PromotionType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT, BUY_X_GET_Y]
    PromotionScope:
      type: string
      enum: [ORDER, CATEGORY, PRODUCT]
    ProductPromotionPreview:
      type: object
      required:
        [
          promotionId,
          name,
          kind,
          badge,
          originalPrice,
          minSubtotal,
          minQuantity,
          conditionsMet,
          promotionCount,
          endsAt,
        ]
      properties:
        promotionId:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/PromotionBadgeKind'
        badge:
          type: string
          example: -20%
        originalPrice:
          type: number
        estimatedUnitPrice:
          type: number
          nullable: true
        discountValue:
          type: number
          nullable: true
        maxDiscount:
          type: number
          nullable: true
        minSubtotal:
          type: number
        minQuantity:
          type: integer
        conditionsMet:
          type: boolean
        promotionCount:
          type: integer
        endsAt:
          type: string
          format: date-time
    Category:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
    Product:
      type: object
      required: [id, categoryId, name, description, price, available]
      properties:
        id:
          type: string
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        image:
          type: string
          nullable: true
        available:
          type: boolean
        promotion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProductPromotionPreview'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/ProductPromotionPreview'
        configGroups:
          type: array
          items:
            type: object
        recipe:
          type: array
          items:
            type: object
    BranchProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [availableInBranch]
          properties:
            availableInBranch:
              type: boolean
    Promotion:
      type: object
      required: [id, name, startDate, endDate]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/PromotionType'
        scope:
          $ref: '#/components/schemas/PromotionScope'
        discountValue:
          type: number
          nullable: true
        maxDiscount:
          type: number
          nullable: true
        buyQuantity:
          type: integer
          nullable: true
        payQuantity:
          type: integer
          nullable: true
        categoryIds:
          type: array
          items:
            type: string
        productIds:
          type: array
          items:
            type: string
        branchIds:
          type: array
          items:
            type: string
        code:
          type: string
          nullable: true
    PromotionCatalogItem:
      type: object
      required:
        [
          id,
          name,
          kind,
          badge,
          startDate,
          endDate,
          daysOfWeek,
          minSubtotal,
          minQuantity,
          branchIds,
          categoryIds,
          productIds,
          categories,
          products,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/PromotionType'
        scope:
          $ref: '#/components/schemas/PromotionScope'
        kind:
          $ref: '#/components/schemas/PromotionBadgeKind'
        badge:
          type: string
        discountValue:
          type: number
          nullable: true
        maxDiscount:
          type: number
          nullable: true
        buyQuantity:
          type: integer
          nullable: true
        payQuantity:
          type: integer
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        daysOfWeek:
          type: array
          items:
            type: integer
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        minSubtotal:
          type: number
        minQuantity:
          type: integer
        branchIds:
          type: array
          items:
            type: string
        code:
          type: string
          nullable: true
        categoryIds:
          type: array
          items:
            type: string
        productIds:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
